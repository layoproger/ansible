- name: Автоматизированная установка docker
  hosts: dock
  become: true
  tasks:
    - block:
      - name: Установка universe
        apt_repository:
          repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_facts['distribution_release'] }} universe"
          state: present
      
      - name: Установка зависимостей
        apt:
          name:
            - ca-certificates
            - curl
          update_cache: yes
          cache_valid_time: 86400

      - name: Создание директории для ключей
        file:
          path: /etc/apt/keyrings
          state: directory
          mode: '0755'

      - name: Скачивание Docker GPG ключа
        get_url:
          url: https://download.docker.com/linux/ubuntu/gpg
          dest: /etc/apt/keyrings/docker.asc
          mode: '0644'
      
      - name: Добавление репозитория Docker
        copy:
          content: |
            Types: deb
            URIs: https://download.docker.com/linux/ubuntu
            Suites: {{ ansible_distribution_release }}
            Components: stable
            Architectures: amd64
            Signed-By: /etc/apt/keyrings/docker.asc
          dest: /etc/apt/sources.list.d/docker.sources
          mode: '0644'
      
      - name: обновление кеша
        apt:
          update_cache: yes
      
      - name: установка пакета dock-ce
        apt:
          name:
            - docker-ce
            - docker-ce-cli
            - containerd.io
            - docker-buildx-plugin
            - docker-compose-plugin
      
      - name: перезапуск сервиса
        ansible.builtin.service:
          name: docker
          state: restarted

      - name: добавление user в группу docker
        ansible.builtin.user:
          name: "{{ ansible_user }}"
          groups: docker
          append: yes
      
      - name: Reboot
        ansible.builtin.reboot:
          reboot_timeout: 3600