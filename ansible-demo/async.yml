- name: Пробуем асинхронные задачи
  hosts: test
  become: true   # Выполняем все задачи от root (т.к. sleep не требует, но для других команд может понадобиться)

  tasks:

    - name: Запускаем долгую задачу в фоне
      block:
        - name: Запуск sleep 15 секунд
          command: /bin/sleep 15   # Команда, которая выполняется 15 секунд
          async: 1000              # Максимальное время ожидания (в секундах). Если задача не завершится за 1000с — Ansible посчитает её проваленной.
          poll: 0                  # 0 = НЕ ждать завершения. Задача уходит в фон, Ansible идёт дальше. Если poll=5 — проверял бы каждые 5 секунд.
          register: sleep_job      # Сохраняем результат (включая ID задачи) в переменную sleep_job

        - name: Показываем информацию о фоновой задаче
          debug:
            var: sleep_job         # Распечатываем содержимое переменной. Там будет ansible_job_id и др.

        - name: Сигнализируем, что задача запущена
          command: echo "Задача запущена в фоне"

    - name: Ожидаем завершения фоновой задачи
      block:
        - name: Проверяем статус задачи
          async_status:            # Специальный модуль для опроса статуса фоновых задач
            jid: "{{ sleep_job.ansible_job_id }}"   # Берём ID из переменной, которую сохранили в блоке 1
          register: job_result     # Сохраняем результат проверки (finished, failed и т.д.)
          until: job_result.finished   # Повторять задачу, пока поле finished не станет true
          retries: 30                  # Максимум 30 попыток (30 * delay = общее время ожидания)
          delay: 2                     # Ждать 2 секунды между попытками
          
        - name: Сообщаем о завершении
          debug:
            msg: "✅ Долгая задача успешно завершена!"